<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Hotel Booking - Homepage</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link href="/assets/css/styles.css" rel="stylesheet">
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-teal shadow-sm">
		<div class="container">
			<a class="navbar-brand fw-bold" href="#">HOTEL</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample07" aria-controls="navbarsExample07" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarsExample07">
				<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
					<li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
					<li class="nav-item"><a class="nav-link" href="#features">Rooms</a></li>
					<li class="nav-item"><a class="nav-link" href="#">Facilities</a></li>
					<li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<header class="py-5 bg-teal text-white">
		<div class="container">
			<h1 class="display-6 fw-bold text-center mb-4">Search Address</h1>
			<div class="card shadow-lg border-0 mx-auto" style="max-width: 1000px;">
				<div class="card-body p-3 p-md-4">
					<form class="row g-2 align-items-center">
						<div class="col-12 col-md-4">
							<input type="text" class="form-control" placeholder="Destination" />
						</div>
						<div class="col-6 col-md-2">
							<input type="date" class="form-control" placeholder="Check-in" />
						</div>
						<div class="col-6 col-md-2">
							<input type="date" class="form-control" placeholder="Check-out" />
						</div>
						<div class="col-12 col-md">
							<select class="form-select">
								<option selected>Guests</option>
								<option>1 Guest</option>
								<option>2 Guests</option>
								<option>3 Guests</option>
							</select>
						</div>
						<div class="col-12 col-md-auto">
							<button type="button" class="btn btn-coral w-100">Search Rooms</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</header>

	<section id="features" class="py-5">
		<div class="container">
			<h2 class="h3 fw-bold mb-4">Featured Rooms</h2>
			<div class="row g-4">
				<div class="col-12 col-md-4">
					<div class="card h-100 shadow-sm">
						<img src="https://images.unsplash.com/photo-1505692794403-34d4982f88aa?q=80&w=1200&auto=format&fit=crop" class="card-img-top" alt="Standard Room">
						<div class="card-body">
							<h5 class="card-title">Standard Room</h5>
							<p class="text-muted mb-2">$120 <small class="text-body-secondary">/ night</small></p>
							<button class="btn btn-coral">Book Now</button>
						</div>
					</div>
				</div>
				<div class="col-12 col-md-4">
					<div class="card h-100 shadow-sm">
						<img src="https://images.unsplash.com/photo-1505691723518-36a5ac3b2d55?q=80&w=1200&auto=format&fit=crop" class="card-img-top" alt="Deluxe Room">
						<div class="card-body">
							<h5 class="card-title">Deluxe Room</h5>
							<p class="text-muted mb-2">$180 <small class="text-body-secondary">/ night</small></p>
							<button class="btn btn-coral">Book Now</button>
						</div>
					</div>
				</div>
				<div class="col-12 col-md-4">
					<div class="card h-100 shadow-sm">
						<img src="https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?q=80&w=1200&auto=format&fit=crop" class="card-img-top" alt="Suite">
						<div class="card-body">
							<h5 class="card-title">Suite</h5>
							<p class="text-muted mb-2">$250 <small class="text-body-secondary">/ night</small></p>
							<button class="btn btn-coral">Book Now</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<section class="py-4">
		<div class="container">
			<h2 class="h3 fw-bold mb-3">Booking Form</h2>
			<div class="card shadow-sm">
				<div class="card-body">
					<form class="row g-3 align-items-end">
						<div class="col-12 col-md-4">
							<label class="form-label">Name</label>
							<input type="text" class="form-control" placeholder="Name">
						</div>
						<div class="col-12 col-md-4">
							<label class="form-label">Email</label>
							<input type="email" class="form-control" placeholder="Email">
						</div>
						<div class="col-12 col-md-4">
							<label class="form-label">Phone</label>
							<input type="tel" class="form-control" placeholder="Phone">
						</div>
						<div class="col-6 col-md-3">
							<label class="form-label">Check-in Date</label>
							<input type="date" class="form-control">
						</div>
						<div class="col-6 col-md-3">
							<label class="form-label">Check-out Date</label>
							<input type="date" class="form-control">
						</div>
						<div class="col-12 col-md-3">
							<label class="form-label">Balance</label>
							<input type="text" class="form-control" value="$940" readonly>
						</div>
						<div class="col-12 col-md-3 d-grid">
							<button class="btn btn-coral">Confirm Booking</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</section>

	<footer class="py-4 border-top">
		<div class="container text-center small text-muted">
			Built with Bootstrap • <a href="/pages/admin.html">Admin</a> • <a href="/pages/widgets.html">Widgets</a>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
